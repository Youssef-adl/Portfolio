    const initThree = () => {
      const canvas = document.getElementById('three-canvas');
      if (!canvas) return;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const particleCount = 800;
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);
      const orange = new THREE.Color('#FF6B35');
      const gold = new THREE.Color('#FFB347');
      const dark = new THREE.Color('#1A1A24');

      for (let i = 0; i < particleCount; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 20;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 20;
        const mixColor = Math.random() > 0.6 ? orange : (Math.random() > 0.5 ? gold : dark);
        colors[i * 3] = mixColor.r;
        colors[i * 3 + 1] = mixColor.g;
        colors[i * 3 + 2] = mixColor.b;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.03,
        vertexColors: true,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
      });

      const particles = new THREE.Points(geometry, material);
      scene.add(particles);

      const shapes = [];
      const shapeGeometries = [
        new THREE.TorusGeometry(0.4, 0.15, 8, 20),
        new THREE.OctahedronGeometry(0.3),
        new THREE.IcosahedronGeometry(0.25),
        new THREE.TorusKnotGeometry(0.25, 0.08, 64, 8)
      ];

      for (let i = 0; i < 6; i++) {
        const geo = shapeGeometries[i % shapeGeometries.length];
        const mat = new THREE.MeshBasicMaterial({
          color: i % 2 === 0 ? '#FF6B35' : '#FFB347',
          wireframe: true,
          transparent: true,
          opacity: 0.15
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(
          (Math.random() - 0.5) * 15,
          (Math.random() - 0.5) * 10,
          (Math.random() - 0.5) * 10 - 5
        );
        mesh.userData = {
          rotSpeed: { x: (Math.random() - 0.5) * 0.01, y: (Math.random() - 0.5) * 0.01 },
          floatSpeed: Math.random() * 0.002 + 0.001,
          floatOffset: Math.random() * Math.PI * 2
        };
        scene.add(mesh);
        shapes.push(mesh);
      }

      camera.position.z = 5;

      let mouseX = 0, mouseY = 0;
      document.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
        mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
      });

      let frameId;
      const animate = () => {
        frameId = requestAnimationFrame(animate);
        const time = Date.now() * 0.001;

        particles.rotation.y += 0.0003;
        particles.rotation.x += 0.0001;

        shapes.forEach((shape) => {
          shape.rotation.x += shape.userData.rotSpeed.x;
          shape.rotation.y += shape.userData.rotSpeed.y;
          shape.position.y += Math.sin(time * shape.userData.floatSpeed * 100 + shape.userData.floatOffset) * 0.002;
        });

        camera.position.x += (mouseX * 0.5 - camera.position.x) * 0.02;
        camera.position.y += (-mouseY * 0.5 - camera.position.y) * 0.02;
        camera.lookAt(scene.position);

        renderer.render(scene, camera);
      };
      animate();

      const handleResize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      };
      window.addEventListener('resize', handleResize);

      return () => {
        cancelAnimationFrame(frameId);
        window.removeEventListener('resize', handleResize);
      };
    };
